name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # =========================================================================
      # 1. Quality Gates (Format, Lint, Type Check)
      # =========================================================================
      
      - name: Check Code Formatting (Prettier)
        run: npx prettier --check . || echo "Format check warning"

      - name: Run Linter
        run: npm run lint || echo "Linter warning"

      - name: TypeScript Compiler Verification (Type Check)
        run: npx tsc --noEmit

      # =========================================================================
      # 2. Automated SEO & Asset Generation
      # =========================================================================
      
      - name: Generate Sitemap, Robots.txt, RSS, and Search Index
        run: node scripts/generate-seo-assets.js --portfolio .

      # =========================================================================
      # 3. Build Web Application
      # =========================================================================

      - name: Build Portfolio Hub
        run: npm run build

      # =========================================================================
      # 4. Merge Sub-Project Build Folders
      # =========================================================================

      - name: Copy Static Sub-Project Builds to Output
        run: |
          for dir in */; do
            dir=${dir%/} # strip trailing slash
            if [[ "$dir" != "node_modules" && "$dir" != "dist" && "$dir" != "public" && "$dir" != "src" && "$dir" != ".github" && "$dir" != ".git" && "$dir" != "inspiration" && "$dir" != "scripts" && "$dir" != "automation" && "$dir" != "docs" ]]; then
              if [[ -f "$dir/index.html" ]]; then
                echo "Merging sub-project build output: $dir"
                mkdir -p dist/$dir
                cp -r $dir/* dist/$dir/
              fi
            fi
          done
        shell: bash

      # =========================================================================
      # 5. Deploy to GitHub Pages
      # =========================================================================

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
