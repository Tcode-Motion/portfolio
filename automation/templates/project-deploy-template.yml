# Redesigned Reusable GitHub Actions Workflow for Sub-Projects
# Copy this file to your sub-project repo at `.github/workflows/deploy.yml`

name: Build, Verify, and Sync to Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install tree utility
        run: sudo apt-get update && sudo apt-get install -y tree

      # =========================================================================
      # 1. Quality Gates (Install, Lint, Test, Build)
      # =========================================================================
      
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Run Code Formatter Check
        run: npx prettier --check . || echo "Format check warning"

      - name: Run Linter
        run: npm run lint || echo "Linter warning"

      - name: Run Tests
        run: npm test || echo "No tests configured"

      - name: Generate Production Build
        run: npm run build

      # =========================================================================
      # Debug Step: Print Build Output Directory Tree
      # =========================================================================

      - name: Print Build Directory Tree (Debug)
        run: |
          echo "Printing project build directory structure:"
          tree -I 'node_modules|.git' dist/ || tree -I 'node_modules|.git' build/ || ls -R

      # =========================================================================
      # Upload Project Build Artifacts
      # =========================================================================

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-dist
          path: |
            dist/
            build/
          if-no-files-found: error

      # =========================================================================
      # 2. Security Scans
      # =========================================================================

      - name: Scan Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: "HEAD"
          extra_args: --debug --only-verified
        continue-on-error: true # Warning only

      # =========================================================================
      # 3. Synchronize with Central Portfolio Hub
      # =========================================================================

      - name: Generate GitHub App Token for Portfolio Access
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PORTFOLIO_SYNC_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_SYNC_PRIVATE_KEY }}

      - name: Checkout Portfolio Hub
        uses: actions/checkout@v4
        with:
          repository: Tcode-Motion/portfolio
          token: ${{ steps.app-token.outputs.token }}
          path: portfolio
          persist-credentials: true

      - name: Print Portfolio Root Tree Before Merge (Debug)
        run: |
          echo "Printing portfolio structure before copying project files:"
          tree -L 2 -I 'node_modules|.git' portfolio/

      - name: Run Project Registration Script
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node portfolio/scripts/register-project.cjs --metadata portfolio-metadata.json --portfolio portfolio

      - name: Deploy Compiled Site to Portfolio Folder
        run: |
          # Extract project ID/directory name from metadata
          PROJECT_ID=$(jq -r '.id' portfolio-metadata.json)
          
          # Clean old files and recreate directory in portfolio root
          rm -rf portfolio/$PROJECT_ID
          mkdir -p portfolio/$PROJECT_ID
          
          # Copy new build files (check whether output is dist or build)
          if [ -d "dist" ]; then
            cp -r dist/* portfolio/$PROJECT_ID/
          elif [ -d "build" ]; then
            cp -r build/* portfolio/$PROJECT_ID/
          else
            echo "❌ Error: Build output directory not found."
            exit 1
          fi
          
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Run Build Post-Processing (Rewrite Asset Paths)
        run: |
          node portfolio/scripts/post-process-build.cjs portfolio/$PROJECT_ID $PROJECT_ID

      # =========================================================================
      # Quality Gate: Fail if portfolio/<project-name>/index.html is missing
      # =========================================================================

      - name: Verify Synced index.html Exists
        run: |
          TARGET_INDEX="portfolio/$PROJECT_ID/index.html"
          if [ ! -f "$TARGET_INDEX" ]; then
            echo "❌ Critical Error: Sync failed. $TARGET_INDEX does not exist!"
            exit 1
          else
            echo "✓ Verified: $TARGET_INDEX exists."
          fi

      - name: Print Portfolio Root Tree After Merge (Debug)
        run: |
          echo "Printing portfolio structure after copying project files:"
          tree -L 3 -I 'node_modules|.git' portfolio/

      - name: Commit and Push Changes to Portfolio
        run: |
          cd portfolio
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage metadata and project directory
          git add src/content/projects/showcase.json
          git add $PROJECT_ID/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "chore(auto): deploy/sync project '$PROJECT_ID' build and metadata"
            git push origin main
          fi

      # =========================================================================
      # 4. Wait for and Verify Live Pages Deployment (HTTP 200)
      # =========================================================================

      - name: Wait for and Verify Live Deployment
        run: |
          URL="https://tanmoy.is-a.dev/$PROJECT_ID/"
          echo "Waiting for live URL to become active: $URL"
          
          # Poll the URL for up to 5 minutes (30 attempts, 10s sleep)
          attempts=0
          max_attempts=30
          while [ $attempts -lt $max_attempts ]; do
            status=$(curl -o /dev/null -s -w "%{http_code}" "$URL")
            echo "Attempt $((attempts+1))/$max_attempts: HTTP status is $status"
            if [ "$status" -eq 200 ]; then
              echo "✅ Verification SUCCESS! $URL is live with HTTP 200."
              exit 0
            fi
            attempts=$((attempts+1))
            sleep 10
          done
          
          echo "❌ Verification FAILED! URL did not return HTTP 200 within timeout."
          exit 1

